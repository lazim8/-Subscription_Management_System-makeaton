{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="form-card" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
      <div class="brand-logo mx-auto mb-2" style="width: 32px; height: 32px; background: var(--accent-primary); color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: 700;">B</div>
      <h1 class="page-title fs-4">Forgot your password?</h1>
      <p class="page-subtitle">Enter your registered email and we will send you a link to reset your password.</p>
    </div>

    <form method="post" novalidate>
      {% csrf_token %}

      <div class="form-group">
        <label for="id_email" class="form-label">Registered Email</label>
        <input type="email" name="email" id="id_email" class="form-control" placeholder="you@company.com" required autofocus>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
      </div>
    </form>

    <div class="text-center mt-4 pt-3 border-top" style="font-size: 13px; color: var(--text-muted);">
      Remember your password? <a href="{% url 'accounts:login' %}" style="font-weight: 500;">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
