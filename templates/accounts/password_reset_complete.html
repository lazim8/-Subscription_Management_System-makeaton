{% extends "base.html" %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="form-card text-center" style="max-width: 440px; width: 100%;">
    <div class="brand-logo mx-auto mb-3" style="width: 36px; height: 36px; background: var(--status-green-bg); color: var(--status-green-text); border: 1px solid var(--status-green-border); display: flex; align-items: center; justify-content: center; border-radius: 50%;">
      <i class="bi bi-check-lg fs-5"></i>
    </div>
    <h1 class="page-title fs-4">Password reset complete</h1>
    <p class="page-subtitle mt-2">Your new password has been set. You may now sign in to your Brightloop account.</p>

    <div class="mt-4">
      <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">Sign In Now</a>
    </div>
  </div>
</div>
{% endblock %}
